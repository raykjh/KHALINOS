name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      # Real Godot tests require the separately digest-approved 4.7.1 binary and
      # display runtime used by the Cloud qualification. CI still exercises all
      # compilers, contracts, API/UI behavior, and browser runtime verification.
      - run: python -m pytest -q -k "not real_godot"
